<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ChatGPT Interface</title>
  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      height: 100%;
      margin: 0;
      padding: 10px;
      overflow: hidden; /* Prevents outer scrollbars */
      font-family: Arial, sans-serif;
      background-color: #343541;
      color: #ffffff;
      display: flex;
      flex-direction: column;
    }
    h2 {
      margin: 0 0 10px 0;
      font-size: 1.1rem;
    }
    #chat-box {
      flex: 1; /* Takes up all remaining vertical space */
      overflow-y: auto; /* Only scrolls inside the chat box if messages overflow */
      border: 1px solid #555;
      padding: 10px;
      margin-bottom: 10px;
      background-color: #444654;
      border-radius: 5px;
    }
    .message {
      margin-bottom: 10px;
      word-wrap: break-word;
    }
    .user { font-weight: bold; color: #10a37f; }
    .ai { font-weight: bold; color: #ececf1; }
    #input-container {
      display: flex;
      gap: 8px;
    }
    input {
      flex: 1;
      padding: 10px;
      border-radius: 5px;
      border: 1px solid #555;
      background: #40414f;
      color: white;
      font-size: 0.9rem;
    }
    button {
      padding: 10px 16px;
      border: none;
      background-color: #10a37f;
      color: white;
      border-radius: 5px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    button:disabled {
      background-color: #666;
    }
  </style>
</head>
<body>

  <h2>AI Chat</h2>
  <div id="chat-box"></div>

  <div id="input-container">
    <input type="text" id="user-input" placeholder="Type a message..." />
    <button id="send-btn" onclick="sendMessage()">Send</button>
  </div>

  <script>
    const WORKER_URL = "YOUR_WORKER_URL_HERE"; // Ensure your actual .workers.dev URL is here!

    async function sendMessage() {
      const inputField = document.getElementById("user-input");
      const sendBtn = document.getElementById("send-btn");
      const chatBox = document.getElementById("chat-box");
      const text = inputField.value.trim();

      if (!text) return;

      chatBox.innerHTML += `<div class="message"><span class="user">You:</span> ${text}</div>`;
      inputField.value = "";
      sendBtn.disabled = true;

      chatBox.innerHTML += `<div class="message" id="loading"><span class="ai">AI:</span> Thinking...</div>`;
      chatBox.scrollTop = chatBox.scrollHeight;

      try {
        const res = await fetch(WORKER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text })
        });
        const data = await res.json();
        
        const loadingElem = document.getElementById("loading");
        if (loadingElem) loadingElem.remove();

        chatBox.innerHTML += `<div class="message"><span class="ai">AI:</span> ${data.reply || data.error}</div>`;
      } catch (err) {
        const loadingElem = document.getElementById("loading");
        if (loadingElem) loadingElem.remove();

        chatBox.innerHTML += `<div class="message"><span class="ai">AI:</span> Error connecting to backend.</div>`;
      }

      sendBtn.disabled = false;
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    // Allow pressing Enter to send message
    document.getElementById("user-input").addEventListener("keypress", function(e) {
      if (e.key === "Enter") {
        sendMessage();
      }
    });
  </script>

</body>
</html>
