<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ChatGPT Interface</title>
  <style>
    :root {
      --bg-color: #343541;
      --chat-bg: #444654;
      --text-color: #ffffff;
      --input-bg: #40414f;
      --border-color: #555555;
      --accent-color: #10a37f;
      --ai-text-color: #ececf1;
    }

    body.light-mode {
      --bg-color: #f7f7f8;
      --chat-bg: #ffffff;
      --text-color: #202123;
      --input-bg: #ffffff;
      --border-color: #d9d9e3;
      --accent-color: #10a37f;
      --ai-text-color: #353740;
    }

    * {
      box-sizing: border-box;
    }
    html, body {
      height: 100%;
      margin: 0;
      padding: 10px;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      transition: background-color 0.2s, color 0.2s;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    h2 {
      margin: 0;
      font-size: 1.1rem;
    }
    .theme-btn {
      padding: 4px 10px;
      font-size: 0.8rem;
      border-radius: 4px;
      border: 1px solid var(--border-color);
      background: var(--input-bg);
      color: var(--text-color);
      cursor: pointer;
    }
    #chat-box {
      flex: 1;
      overflow-y: auto;
      border: 1px solid var(--border-color);
      padding: 10px;
      margin-bottom: 10px;
      background-color: var(--chat-bg);
      border-radius: 5px;
    }
    .message {
      margin-bottom: 12px;
      word-wrap: break-word;
    }
    .user { font-weight: bold; color: var(--accent-color); }
    .ai { font-weight: bold; color: var(--ai-text-color); }

    /* Style Tags Toolbar */
    #style-bar {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }
    .style-tag {
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
    }
    .style-tag:hover {
      border-color: var(--accent-color);
    }

    #input-container {
      display: flex;
      gap: 8px;
    }
    input {
      flex: 1;
      padding: 10px;
      border-radius: 5px;
      border: 1px solid var(--border-color);
      background: var(--input-bg);
      color: var(--text-color);
      font-size: 0.9rem;
    }
    button.send-btn {
      padding: 10px 16px;
      border: none;
      background-color: var(--accent-color);
      color: white;
      border-radius: 5px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    button.send-btn:disabled {
      background-color: #666;
    }

    /* Save/Open Button for Images */
    .img-action-btn {
      display: inline-block;
      margin-top: 6px;
      padding: 6px 12px;
      font-size: 0.8rem;
      color: white;
      background-color: var(--accent-color);
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .img-action-btn:hover {
      opacity: 0.9;
    }

    /* Typing Indicator Animation */
    .typing-indicator {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-left: 6px;
    }
    .typing-indicator span {
      width: 6px;
      height: 6px;
      background-color: var(--ai-text-color);
      border-radius: 50%;
      animation: pulse 1.4s infinite ease-in-out both;
    }
    .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
    .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }

    @keyframes pulse {
      0%, 80%, 100% { transform: scale(0); opacity: 0.3; }
      40% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="header">
    <h2>AI Chat & Image Generator</h2>
    <button class="theme-btn" onclick="toggleTheme()">☀️ / 🌙</button>
  </div>

  <div id="chat-box" onscroll="handleScroll()"></div>

  <!-- Style Presets Toolbar -->
  <div id="style-bar">
    <button class="style-tag" onclick="appendStyle('--pixelart')">👾 Pixel Art</button>
    <button class="style-tag" onclick="appendStyle('--anime')">🎨 Anime</button>
    <button class="style-tag" onclick="appendStyle('--3d')">🎮 3D Render</button>
    <button class="style-tag" onclick="appendStyle('--cinematic')">🎬 Cinematic</button>
  </div>

  <div id="input-container">
    <input type="text" id="user-input" placeholder='Try "draw a flying castle"...' />
    <button class="send-btn" id="send-btn" onclick="sendMessage()">Send</button>
  </div>

  <script>
    // --- WORKER URL PLACEHOLDER ---
    const WORKER_URL = "YOUR_WORKER_URL_HERE"; 
    
    let currentSystemPrompt = "You are a helpful AI assistant.";
    let username = "User";
    let waitingForNewPersonality = false;
    let userHasScrolledUp = false;

    // Detect if user scrolls up to temporarily disable auto-scroll
    function handleScroll() {
      const chatBox = document.getElementById("chat-box");
      const isAtBottom = chatBox.scrollHeight - chatBox.clientHeight <= chatBox.scrollTop + 30;
      userHasScrolledUp = !isAtBottom;
    }

    function autoScroll() {
      if (!userHasScrolledUp) {
        const chatBox = document.getElementById("chat-box");
        chatBox.scrollTop = chatBox.scrollHeight;
      }
    }

    // Toggle Light / Dark Theme
    function toggleTheme() {
      document.body.classList.toggle("light-mode");
    }

    // Append Image Style Presets and automatically prepend "draw"
    function appendStyle(tag) {
      const inputField = document.getElementById("user-input");
      let currentVal = inputField.value.trim();

      const triggers = ["draw", "generate image", "generate an image", "create an image", "/image"];
      const startsWithTrigger = triggers.some(t => currentVal.toLowerCase().startsWith(t));

      if (!startsWithTrigger) {
        currentVal = currentVal ? `draw ${currentVal}` : "draw ";
      }

      if (!currentVal.includes(tag)) {
        inputField.value = `${currentVal} ${tag}`.trim();
      } else {
        inputField.value = currentVal;
      }

      inputField.focus();
    }

    // Convert Base64 data URL to Blob and open in new tab for direct saving
    function downloadImage(base64Data) {
      try {
        const parts = base64Data.split(';base64,');
        const contentType = parts[0].split(':')[1];
        const raw = window.atob(parts[1]);
        const uInt8Array = new Uint8Array(raw.length);

        for (let i = 0; i < raw.length; ++i) {
          uInt8Array[i] = raw.charCodeAt(i);
        }

        const blob = new Blob([uInt8Array], { type: contentType });
        const blobUrl = URL.createObjectURL(blob);
        
        // Open the raw image file in a full browser tab
        window.open(blobUrl, '_blank');
      } catch (e) {
        alert("Could not open image. You can right-click the image directly in the chat to save it.");
      }
    }

    async function sendMessage(textToSend) {
      const inputField = document.getElementById("user-input");
      const sendBtn = document.getElementById("send-btn");
      const chatBox = document.getElementById("chat-box");
      
      let text = textToSend || inputField.value.trim();
      if (!text) return;

      // Expand style flags into clear prompt instructions
      text = text
        .replace(/--pixelart/gi, "in detailed 16-bit pixel art style")
        .replace(/--anime/gi, "in vibrant high quality anime style")
        .replace(/--3d/gi, "in realistic 3D game engine render style")
        .replace(/--cinematic/gi, "cinematic lighting, photorealistic 8k photo");

      chatBox.innerHTML += `<div class="message"><span class="user">${escapeHtml(username)}:</span> ${escapeHtml(text)}</div>`;
      inputField.value = "";
      sendBtn.disabled = true;

      if (waitingForNewPersonality) {
        currentSystemPrompt = text;
        waitingForNewPersonality = false;
        chatBox.innerHTML += `<div class="message"><span class="ai">AI:</span> Updated personality.</div>`;
        sendBtn.disabled = false;
        autoScroll();
        return;
      }

      const lower = text.toLowerCase();
      if (lower.includes("update personality") || lower.includes("change personality") || lower.includes("update your personality") || lower.includes("change your personality")) {
        const splitIndex = lower.indexOf("to ");
        const colonIndex = text.indexOf(":");
        
        let newPrompt = "";
        if (colonIndex !== -1) {
          newPrompt = text.substring(colonIndex + 1).trim();
        } else if (splitIndex !== -1) {
          newPrompt = text.substring(splitIndex + 3).trim();
        }

        if (newPrompt) {
          currentSystemPrompt = newPrompt;
          chatBox.innerHTML += `<div class="message"><span class="ai">AI:</span> Updated personality.</div>`;
        } else {
          waitingForNewPersonality = true;
          chatBox.innerHTML += `<div class="message"><span class="ai">AI:</span> What should I update my personality to?</div>`;
        }

        sendBtn.disabled = false;
        autoScroll();
        return;
      }

      // Animated 3-dot typing indicator
      chatBox.innerHTML += `
        <div class="message" id="loading">
          <span class="ai">AI:</span>
          <span class="typing-indicator">
            <span></span><span></span><span></span>
          </span>
        </div>`;
      autoScroll();

      try {
        const res = await fetch(WORKER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ 
            message: text,
            systemPrompt: currentSystemPrompt,
            username: username
          })
        });
        const data = await res.json();
        
        const loadingElem = document.getElementById("loading");
        if (loadingElem) loadingElem.remove();

        if (data.isImage) {
          // Render Image + Open/Save Button
          chatBox.innerHTML += `
            <div class="message">
              <span class="ai">AI:</span><br>
              <img src="${data.reply}" style="max-width:100%; border-radius:8px; margin-top:5px;" alt="AI Image" /><br>
              <button class="img-action-btn" onclick="downloadImage('${data.reply}')">🖼️ Open Full Image to Save</button>
            </div>`;
        } else {
          // Render Text
          const reply = data.reply || data.error || "The AI could not generate a reply.";
          chatBox.innerHTML += `<div class="message"><span class="ai">AI:</span> ${escapeHtml(reply)}</div>`;
        }
      } catch (err) {
        const loadingElem = document.getElementById("loading");
        if (loadingElem) loadingElem.remove();

        chatBox.innerHTML += `<div class="message"><span class="ai">AI:</span> Error connecting to backend.</div>`;
      }

      sendBtn.disabled = false;
      autoScroll();
    }

    function escapeHtml(str) {
      return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    // Listen for messages from TurboWarp Scratch blocks
    window.addEventListener("message", (event) => {
      try {
        const parsed = typeof event.data === "string" ? JSON.parse(event.data) : event.data;
        
        if (parsed && parsed.type === "set_username") {
          if (parsed.username) username = parsed.username;
          return;
        }

        if (parsed && parsed.type === "set_persona") {
          currentSystemPrompt = parsed.prompt;
          const chatBox = document.getElementById("chat-box");
          chatBox.innerHTML += `<div class="message"><span class="ai">AI:</span> Updated personality.</div>`;
          autoScroll();
          return;
        }
      } catch(e) {}

      if (typeof event.data === "string" && event.data.length > 0) {
        sendMessage(event.data);
      }
    });

    window.addEventListener("DOMContentLoaded", () => {
      const urlParams = new URLSearchParams(window.location.search);
      const userParam = urlParams.get("username");
      const personaParam = urlParams.get("persona");
      const msgParam = urlParams.get("msg");

      if (userParam) username = decodeURIComponent(userParam);
      if (personaParam) currentSystemPrompt = decodeURIComponent(personaParam);
      if (msgParam) sendMessage(decodeURIComponent(msgParam));
    });

    document.getElementById("user-input").addEventListener("keypress", function(e) {
      if (e.key === "Enter") {
        sendMessage();
      }
    });
  </script>

</body>
</html>
