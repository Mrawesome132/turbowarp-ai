<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ChatGPT Interface</title>
  <style>
    :root {
      --bg-color: #343541;
      --chat-bg: #444654;
      --text-color: #ffffff;
      --input-bg: #40414f;
      --border-color: #555555;
      --accent-color: #10a37f;
      --ai-text-color: #ececf1;
    }

    body.light-mode {
      --bg-color: #f7f7f8;
      --chat-bg: #ffffff;
      --text-color: #202123;
      --input-bg: #ffffff;
      --border-color: #d9d9e3;
      --accent-color: #10a37f;
      --ai-text-color: #353740;
    }

    * {
      box-sizing: border-box;
    }
    html, body {
      height: 100%;
      margin: 0;
      padding: 10px;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      transition: background-color 0.2s, color 0.2s;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    h2 {
      margin: 0;
      font-size: 1.1rem;
    }
    .theme-btn {
      padding: 4px 10px;
      font-size: 0.8rem;
      border-radius: 4px;
      border: 1px solid var(--border-color);
      background: var(--input-bg);
      color: var(--text-color);
      cursor: pointer;
    }
    #chat-box {
      flex: 1;
      overflow-y: auto;
      border: 1px solid var(--border-color);
      padding: 10px;
      margin-bottom: 10px;
      background-color: var(--chat-bg);
      border-radius: 5px;
    }
    .message {
      margin-bottom: 12px;
      word-wrap: break-word;
    }
    .user { font-weight: bold; color: var(--accent-color); }
    .ai { font-weight: bold; color: var(--ai-text-color); }

    /* Style Tags Toolbar */
    #style-bar {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }
    .style-tag {
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
    }
